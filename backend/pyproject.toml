[project]
name = "stock-portfolio-tracker"
version = "1.0.0"
description = "A web-based stock portfolio tracker with AI-powered recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.1",
    "yfinance>=0.2.36",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "pytz>=2024.1",
]

[tool.uv]
package = false
