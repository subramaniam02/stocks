server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Default (60s) is well under real LLM call latency — chat on a large
        # portfolio chunks into several sequential Ollama calls and can run
        # 2+ minutes; without this nginx 504s the request while the backend
        # is still working on a response that would have succeeded.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
